name: Release SDK

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    env:
      PROSETTA_WASM_PATH: ${{ vars.PROSETTA_WASM_PATH }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Ensure release commit is on main
        run: |
          if ! git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main; then
            echo "Release tag $GITHUB_REF_NAME must point to a commit in main's history" >&2
            exit 1
          fi

      - name: Install project tools
        uses: jdx/mise-action@v4
        with:
          version: 2026.11.7
          cache: false

      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${RELEASE_TAG#v}"
          if [ "$tag_version" != "$package_version" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version" >&2
            exit 1
          fi

      - name: Install dependencies
        run: mise exec -- just install-ci

      - name: Check WASM path configuration
        run: |
          if [ -z "$PROSETTA_WASM_PATH" ]; then
            echo "Set the PROSETTA_WASM_PATH repository variable in GitHub Actions settings" >&2
            exit 1
          fi

      - name: Type-check
        run: mise exec -- just check

      - name: Build production bundle and package
        run: mise exec -- just build-prod

      - name: Verify package archive
        run: mise exec -- just verify-package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: prosetta-sdk-${{ github.run_id }}
          if-no-files-found: error
          path: |
            dist/prosetta-sdk.js
            dist/*.tgz

  attach-release-assets:
    name: Attach release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: prosetta-sdk-${{ github.run_id }}
          path: dist

      - name: Attach bundle and npm archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/prosetta-sdk.js dist/*.tgz --repo "$GITHUB_REPOSITORY" --clobber

  publish-npm:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: prosetta-sdk-${{ github.run_id }}
          path: dist

      - name: Configure npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish npm archive
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PUBLISH_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish ./dist/*.tgz --access public --tag "$PUBLISH_TAG"

  publish-github-packages:
    name: Publish to GitHub Packages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: prosetta-sdk-${{ github.run_id }}
          path: dist

      - name: Configure GitHub Packages registry
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@venkateshcv1809'

      - name: Publish npm archive
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          PUBLISH_TAG: ${{ github.event.release.prerelease && 'next' || 'latest' }}
        run: npm publish ./dist/*.tgz --registry=https://npm.pkg.github.com --tag "$PUBLISH_TAG"
